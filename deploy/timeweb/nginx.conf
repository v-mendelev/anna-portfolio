# nginx server block for the static build on a Timeweb Cloud VPS.
# Document root points to the "current" symlink managed by
# .github/workflows/deploy-timeweb.yml (release-based deploys, instant rollback).
#
# Install:
#   1. copy security-headers.conf to /etc/nginx/snippets/
#   2. copy this file to /etc/nginx/sites-available/<site>.conf, adjust server_name/root
#   3. ln -s into sites-enabled, then `nginx -t && systemctl reload nginx`
#   4. TLS: `certbot --nginx -d example.ru -d www.example.ru`
#
# Note: nginx does not inherit add_header into a location that defines its own
# add_header, so security headers are included in every location explicitly.

server {
    listen 80;
    listen [::]:80;
    server_name example.ru www.example.ru;

    root /var/www/site/current;
    index index.html;
    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # Astro builds with trailingSlash: 'always' + build.format: 'directory'.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    # Fingerprinted assets: cache forever.
    location /_astro/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
