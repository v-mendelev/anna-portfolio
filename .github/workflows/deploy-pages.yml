name: Deploy demo to GitHub Pages

# main -> GitHub Pages (demo). Deploys only after the full CI pipeline passes.
# Rollback: run this workflow manually with `ref` = a previous tag/commit SHA
# (or `git revert` on main). See DEPLOYMENT.md.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA or tag to deploy (empty = latest main). Use for rollback.
        type: string
        required: false
        default: ''

permissions:
  contents: read

# One Pages deployment at a time; never cancel an in-progress deployment.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.ref }}

  build:
    name: Build (GitHub Pages)
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    outputs:
      sha: ${{ steps.info.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      # Lets the live smoke test prove which commit is actually being served.
      - name: Record the deployed commit (build-info.json)
        id: info
        run: |
          sha="$(git rev-parse HEAD)"
          printf '{"sha":"%s","run":"%s"}\n' "$sha" "$GITHUB_RUN_ID" > public/build-info.json
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@v6

      - name: Export site URL and base path
        run: |
          {
            echo "DEPLOY_TARGET=github-pages"
            echo "SITE_URL=${{ steps.pages.outputs.origin }}"
            echo "BASE_PATH=${{ steps.pages.outputs.base_path }}"
          } >> "$GITHUB_ENV"

      - name: Build and upload with the official Astro action
        uses: withastro/action@v6
        with:
          node-version: '26'

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  verify:
    name: Verify live site
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      statuses: write
    steps:
      # The workflow's own commit (not the rollback ref) provides the smoke script.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc

      # Waits until build-info.json reports the deployed SHA, then checks HTTP 200
      # on every route from tests/e2e/routes.ts and every CSS/JS/font asset.
      - name: Live smoke (commit SHA, routes, CSS/JS/fonts)
        id: smoke
        run: node scripts/delivery/run.ts live-smoke
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          EXPECTED_SHA: ${{ needs.build.outputs.sha }}

      - name: Report the result on the commit (delivery/live)
        if: ${{ always() && needs.build.outputs.sha != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.build.outputs.sha }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          STATE: ${{ steps.smoke.outcome == 'success' && 'success' || 'failure' }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state="$STATE" -f context="delivery/live" -f target_url="$PAGE_URL" \
            -f description="Live smoke on GitHub Pages: $STATE" > /dev/null
          echo "Live site: $PAGE_URL ($STATE, commit $SHA)"
