name: Delivery · pull request guard

# For PRs into dev (and PRs retargeted to main):
# - new commits / draft / reopen / base edit: if auto-merge is on but the new
#   head has no recorded publish approval → auto-merge is switched off;
# - merged: the feature/* head branch is deleted, only if it still points at
#   the merged head SHA, is in this repository and is not dev/main.
#
# Security: pull_request_target runs the BASE branch's workflow and code. The
# PR head is never checked out or executed: actions/checkout below uses its
# default (the base branch). Never point it at the PR head.
on:
  pull_request_target:
    types: [synchronize, converted_to_draft, reopened, edited, closed]
    # main too: retargeting an approved PR away from dev must revoke its auto-merge.
    branches: [dev, main]

permissions: {}

concurrency:
  group: delivery-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  guard:
    name: Guard auto-merge / clean up branch
    if: vars.DELIVERY_REPOSITORY == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: delivery
    permissions:
      contents: read
    steps:
      - name: Check out the base branch (trusted code only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc

      - name: Guard approval / delete merged feature branch
        run: node scripts/delivery/run.ts pull-request
        env:
          DELIVERY_REPOSITORY: ${{ vars.DELIVERY_REPOSITORY }}
          DELIVERY_APPROVERS: ${{ vars.DELIVERY_APPROVERS }}
          DELIVERY_APP_ID: ${{ vars.DELIVERY_APP_ID }}
          DELIVERY_APP_PRIVATE_KEY: ${{ secrets.DELIVERY_APP_PRIVATE_KEY }}
